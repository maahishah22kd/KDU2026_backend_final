<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Zomato Stock Price Tracker</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/main.css">
    </head>
    <body>
        <div class="main-content">
            <div class="heading">
                KDU Stock Market Dashboard
                </div>
                <div class="content-row">
                <section class="left-content">
        
                    <div class="controls-row">
                        <div class="control-box control-left">
                            <div class="box-inner">
                                <div class="logo-img" aria-hidden="true"></div>
                                <div class="box-label">Zomato</div>
                            </div>
                        </div>
                        <div class="control-box control-center">
                            <div class="box-inner">
                                <div class="box-title">Price</div>
                                <div class="price-value"><span class="change positive"></span></div>
                            </div>
                        </div>
                        <div class="control-box control-right">
                            <div class="box-inner">
                                <input class="qty" type="number" placeholder="Enter qty" min="1">
                                <div class="box-actions">
                                
                                </div>
                            </div>
                        </div>

                        <div class="control-box btn-buy">
                            <button class="btn btn-buy" type="button">BUY</button>
                        </div>

                        <div class="control-box btn-sell">
                            <button class="btn btn-sell" type="button">SELL</button>
                        </div>
                    </div>

                    
                    <div class="graph">
                        <div class="chart">
                            <div class="bars" aria-hidden="true">
                                <div class="bar green" style="height:18%"></div>
                            </div>
                        </div>
                    </div>
                </section>
                <section class="right-content">
                    <section class="history">
                        HISTORY  
                    </section>
                </section>
                </div>
        <script src="js/main.js" defer></script>
    </body>
</html>
