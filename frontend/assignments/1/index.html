<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>X HomePage</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <div class="main-content">
      <section class="left-content">
        <nav class="navigation-section">
          <div class="nav-items">
            <button class="nav-item" type="button">
              <img src="assets/icons/home.svg" alt="Home" />
              <span>Home</span>
            </button>

            <button class="nav-item" type="button">
              <img src="assets/icons/search.svg" alt="Explore" />
              <span>Explore</span>
            </button>

            <button class="nav-item" type="button">
              <img src="assets/icons/notif-icon.svg" alt="Notifications" />
              <span>Notifications</span>
            </button>

            <button class="nav-item" type="button">
              <img src="assets/icons/mail-icon.svg" alt="Messages" />
              <span>Messages</span>
            </button>

            <button class="nav-item" type="button">
              <img src="assets/icons/slash-icon.svg" alt="Grok" />
              <span>Grok</span>
            </button>

            <button class="nav-item" type="button">
              <img src="assets/icons/list-icon.svg" alt="Lists" />
              <span>Lists</span>
            </button>

            <button class="nav-item" type="button">
              <img src="assets/icons/bookmark-icon.svg" alt="Bookmark" />
              <span>Bookmarks</span>
            </button>
            
            <button class="nav-item" type="button">
              <img src="assets/icons/community-icon.svg" alt="Community" />
              <span>Communities</span>
            </button>

            <button class="nav-item" type="button">
              <img src="assets/icons/premium-icon.svg" alt="Premium" />
              <span>Premium</span>
            </button>

            <button class="nav-item" type="button">
              <img src="assets/icons/profile-icon.svg" alt="Profile" />
              <span>Profile</span>
            </button>

            <button class="nav-item" type="button">
              <img src="assets/icons/more-icon.svg" alt="More" />
              <span>More</span>
            </button>
          </div>

        </nav>
      </section>

      <section class="right-content">
        <section class="tweet-box">
            <div class="composer">
                <div class="composer-top">
                <button class="composer-back" type="button" aria-label="Back">
                    <img src="assets/icons/back-button.svg" alt="Back" />
                </button>

                <a class="composer-drafts" href="#" aria-label="Drafts">Drafts</a>

                </div>

                <div class="composer-main">
                <div class="composer-avatar" aria-hidden="true">
                    <span class="avatar-letter">N</span>
                </div>

                <textarea class="tweet-text" placeholder="What is happening?" rows="3"></textarea>
                </div>

                <div class="tweet-tools">
                <div class="tweet-tools-left">
                    <button class="tool-btn" type="button" aria-label="Add image">
                    <img src="assets/icons/gallery-icon.svg" alt="Add " />
                    </button>

                    <button class="tool-btn" type="button" aria-label="Add GIF">
                    <img src="assets/icons/gif-icon.svg" alt="Add GIF" />
                    </button>

                    <button class="tool-btn" type="button" aria-label="Add GIF">
                    <img src="assets/icons/bullet-icon.svg" alt="Add bullet" />
                    </button>

                    <button class="tool-btn" type="button" aria-label="Add emoji">
                    <img src="assets/icons/smiley-icon.svg" alt="Add emoji" />
                    </button>

                    <button class="tool-btn" type="button" aria-label="Add date">
                    <img src="assets/icons/calendar-icon.svg" alt="Add date" />
                    </button>

                    <button class="tool-btn" type="button" aria-label="Add location">
                    <img src="assets/icons/location-icon.svg" alt="Add location" />
                    </button>
                </div>

                <button class="tweet-btn tweet-btn--top" type="button">Post</button>
                </div>
            </div>
            </section>


        <section class="posts"></section>

        <button class="floating-tweet-box-icon" type="button" aria-label="Create tweet">
          <img src="assets/icons/plus-icon.svg" alt="Create tweet" />
        </button>
      </section>
    </div>

    <script src="js/main.js" defer></script>
  </body>
</html>
