<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Serverless Counter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: Arial, sans-serif; padding: 24px; }
      .card { max-width: 420px; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
      button { padding: 10px 14px; margin-top: 10px; cursor: pointer; }
      .value { font-size: 24px; font-weight: bold; }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>Serverless Counter</h2>
      <p>Current value:</p>
      <div class="value" id="counter">—</div>

      <button onclick="increment()">Add Counter</button>

      <p style="margin-top:12px; font-size:14px; color:#666">
        API URL: <span id="api-url">not set yet</span>
      </p>
    </div>

    <script src="index.js"></script>
  </body>
</html>
